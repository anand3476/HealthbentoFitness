<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7CBF00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D5F2E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGradient)"/>
  
  <!-- Leaf -->
  <g transform="translate(256, 80)">
    <path d="M 0 -40 Q 20 -60 40 -50 Q 50 -40 45 -20 Q 40 0 20 10 Q 0 5 -10 -20 Q -15 -35 0 -40" 
          fill="none" stroke="#E8FF00" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 0 -35 Q 15 -20 25 0" 
          fill="none" stroke="#E8FF00" stroke-width="2"/>
  </g>
  
  <!-- Main Text "Health" -->
  <text x="256" y="240" font-family="Arial, sans-serif" font-size="90" font-weight="bold" 
        text-anchor="middle" fill="white" letter-spacing="-2">Health</text>
  
  <!-- "BENTO" box background -->
  <rect x="120" y="265" width="272" height="80" rx="15" fill="white" opacity="0.95"/>
  
  <!-- "BENTO" text -->
  <text x="256" y="330" font-family="Arial, sans-serif" font-size="72" font-weight="900" 
        text-anchor="middle" fill="#2D5F2E" letter-spacing="2">BENTO</text>
  
  <!-- "FITNESS" text -->
  <text x="256" y="390" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        text-anchor="middle" fill="#E8FF00" letter-spacing="3" font-style="italic">FITNESS</text>
  
  <!-- Dumbbell left -->
  <g transform="translate(80, 410)">
    <ellipse cx="0" cy="0" rx="8" ry="20" fill="white"/>
    <rect x="-4" y="-8" width="8" height="16" fill="white"/>
    <ellipse cx="0" cy="0" rx="8" ry="20" fill="none" stroke="#E8FF00" stroke-width="2"/>
  </g>
  
  <!-- Dumbbell right -->
  <g transform="translate(432, 410)">
    <ellipse cx="0" cy="0" rx="8" ry="20" fill="white"/>
    <rect x="-4" y="-8" width="8" height="16" fill="white"/>
    <ellipse cx="0" cy="0" rx="8" ry="20" fill="none" stroke="#E8FF00" stroke-width="2"/>
  </g>
  
  <!-- Star -->
  <polygon points="256,440 262,460 284,460 267,475 273,495 256,480 239,495 245,475 228,460 250,460" 
           fill="#E8FF00"/>
</svg>
